[tasks.fmt]
description = "Run all fmt:* tasks"
depends = "fmt:*"

[tasks.lint]
description = "Run all lint:* tasks"
depends = "lint:*"

[tasks.test]
description = "Run all test:* tasks"
depends = "test:*"

[tasks.ci]
description = "Run all ci:* tasks"
depends = "ci:*"

[tasks.dev]
description = "Run API and web development servers"
depends = "dev:*"

[tasks.stop_dev]
description = "Stop API and web development servers started by dev tasks"
run = '''
set -eu

pid_dir="target/dev/pids"
if [ ! -d "$pid_dir" ]; then
  echo "No dev pid files found."
  exit 0
fi

stopped=0
for pid_file in "$pid_dir"/*.pid; do
  [ -e "$pid_file" ] || continue

  name="$(basename "$pid_file" .pid)"
  pid="$(cat "$pid_file")"
  case "$pid" in
    ''|*[!0-9]*)
      echo "Removing invalid $name pid file."
      rm -f "$pid_file"
      continue
      ;;
  esac

  if kill -0 "$pid" 2>/dev/null; then
    echo "Stopping $name ($pid)"
    kill "$pid" 2>/dev/null || true
    stopped=1
  else
    echo "Removing stale $name pid ($pid)"
  fi

  rm -f "$pid_file"
done

if [ "$stopped" -eq 0 ]; then
  echo "No dev processes were running."
fi
'''
