name: CI Rust

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MISE_ENV: rust
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install system BLAS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopenblas-dev pkg-config

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        env:
          # Avoid GitHub API rate limits for aqua and cargo-binstall
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # mise installs the rust toolchain but does not apply the
      # `components` field from rust-toolchain.toml, so clippy and rustfmt
      # need to be added explicitly before the lint task can run them.
      - name: Install rust components
        run: rustup component add clippy rustfmt

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build
        run: cargo build --locked --workspace --all-features

      - name: CI
        run: mise run ci:rust
