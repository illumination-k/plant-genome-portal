name: CI Nextflow

on:
  push:
    branches: [main]
    paths:
      - "pipelines/transcriptome/**"
      - "pipelines/chipseq/**"
      - "pipelines/atacseq/**"
      - ".github/workflows/ci_nextflow.yml"
  pull_request:
    paths:
      - "pipelines/transcriptome/**"
      - "pipelines/chipseq/**"
      - "pipelines/atacseq/**"
      - ".github/workflows/ci_nextflow.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Inspect transcriptome pipeline (syntax + DAG)
        run: bash pipelines/transcriptome/tests/inspect.sh

      - name: Inspect chipseq pipeline (syntax + DAG)
        run: bash pipelines/chipseq/tests/inspect.sh

      - name: Inspect atacseq pipeline (syntax + DAG)
        run: bash pipelines/atacseq/tests/inspect.sh

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Verify docker is available
        run: docker version

      - name: Run smoke test against synthetic fixture
        run: bash pipelines/transcriptome/tests/run_smoke.sh

      - name: Upload pipeline outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: transcriptome-smoke-results
          path: |
            pipelines/transcriptome/tests/_results
            pipelines/transcriptome/tests/_work/nf-work/*/.command.log
          if-no-files-found: ignore
